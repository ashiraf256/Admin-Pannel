<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeoXtream Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      color: #00b3ff;
    }
    input, textarea, button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    input, textarea {
      background: #1a1a1a;
      color: white;
    }
    button {
      background: #00b3ff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0096d1;
    }
    .hidden {
      display: none;
    }
    .movie-result {
      border: 1px solid #222;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #111;
    }
    .movie-result img {
      border-radius: 8px;
      width: 100px;
      height: auto;
    }
  </style>
</head>
<body>

  <h1>🎬 LeoXtream Admin Panel</h1>

  <!-- LOGIN -->
  <div id="login">
    <h2>Login</h2>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Login</button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin" class="hidden">
    <h2>TMDB Movie Search</h2>
    <input type="text" id="tmdbQuery" placeholder="Enter movie name">
    <button onclick="searchTMDB()">Search from TMDB</button>
    <div id="tmdbResults"></div>

    <h2>Movie Info</h2>
    <input type="text" id="movieTitle" placeholder="Movie Title">
    <textarea id="movieDescription" placeholder="Description"></textarea>
    <input type="text" id="posterUrl" placeholder="Poster URL">
    <input type="text" id="videoUrl" placeholder="Video Link (from your server)">
    <input type="text" id="vjName" placeholder="VJ Name">

    <h2>GitHub Upload Settings</h2>
    <input type="text" id="repo" placeholder="username/repoName (e.g. ashiraf256/Admin-Pannel)">
    <input type="password" id="token" placeholder="Enter GitHub Token">

    <button onclick="uploadMovie()">📤 Upload Movie</button>
  </div>

  <script>
const PASSWORD = "admin123";

function checkPassword() {
  const pass = document.getElementById('password').value;
  if (pass === PASSWORD) {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
  } else {
    alert("❌ Incorrect password!");
  }
}

async function searchTMDB() {
  const query = document.getElementById('tmdbQuery').value.trim();
  if (!query) return alert('Enter a movie name!');

  const apiKey = 'd6b0fe020db56e35227657fd8c0afd5c';
  const url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&language=en-US&query=${encodeURIComponent(query)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    const container = document.getElementById('tmdbResults');
    container.innerHTML = '';

    if (!data.results.length) {
      container.innerHTML = '<p>No results found.</p>';
      return;
    }

    data.results.slice(0, 5).forEach(m => {
      const div = document.createElement('div');
      div.classList.add('movie-result');
      div.innerHTML = `
        <p><b>${m.title}</b> (${m.release_date || "N/A"})</p>
        <img src="https://image.tmdb.org/t/p/w200${m.poster_path}" alt="${m.title}">
        <p>${m.overview.slice(0, 120)}...</p>
        <button onclick='selectMovie("${m.title.replace(/"/g, '&quot;')}", "${m.overview.replace(/"/g, '&quot;')}", "https://image.tmdb.org/t/p/w500${m.poster_path}")'>Select</button>
      `;
      container.appendChild(div);
    });
  } catch (err) {
    console.error(err);
    alert('⚠️ Failed to connect to TMDB API. Try again later.');
  }
}

function selectMovie(title, desc, poster) {
  document.getElementById('movieTitle').value = title;
  document.getElementById('movieDescription').value = desc;
  document.getElementById('posterUrl').value = poster;
}

async function uploadMovie() {
  const token = document.getElementById('token').value.trim();
  const repo = document.getElementById('repo').value.trim();
  if (!token || !repo) return alert('Enter GitHub token and repo!');

  const movie = {
    title: document.getElementById('movieTitle').value,
    description: document.getElementById('movieDescription').value,
    poster: document.getElementById('posterUrl').value,
    video: document.getElementById('videoUrl').value,
    vj: document.getElementById('vjName').value,
  };

  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/movies.json`);
    let existing = [];
    let sha = null;

    if (res.ok) {
      const json = await res.json();
      existing = JSON.parse(atob(json.content));
      sha = json.sha;
    }

    existing.push(movie);

    const response = await fetch(`https://api.github.com/repos/${repo}/contents/movies.json`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Added ${movie.title}`,
        content: btoa(JSON.stringify(existing, null, 2)),
        sha: sha || undefined
      })
    });

    if (response.ok) alert('✅ Movie uploaded successfully!');
    else alert('❌ Failed to upload. Check your token or repo name.');
  } catch (e) {
    console.error(e);
    alert('⚠️ Error occurred while uploading.');
  }
}
  </script>
</body>
</html>
