<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeoXtream Admin Panel</title>
  <style>
    body {
      background: #0b0c10;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #66fcf1;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      background: #1f2833;
      padding: 20px;
      border-radius: 10px;
    }
    input, textarea, button {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
    input, textarea {
      background: #0b0c10;
      color: #fff;
    }
    button {
      background: #45a29e;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #66fcf1;
      color: #0b0c10;
    }
    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🎬 LeoXtream Admin Panel</h1>
  <form id="movieForm">
    <input type="text" id="title" placeholder="Movie Title" required>
    <textarea id="description" placeholder="Description" required></textarea>
    <input type="text" id="poster" placeholder="Poster Image URL" required>
    <input type="text" id="videoUrl" placeholder="Video URL (Drive or Stream link)" required>
    <input type="text" id="category" placeholder="Category (e.g., Action, Drama, VJ Junior)" required>
    <input type="text" id="vjName" placeholder="VJ Name" required>
    <button type="submit">Upload Movie</button>
  </form>

  <div class="message" id="message"></div>

  <script>
    const OWNER = "ashiraf256";
    const REPO = "Admin-Pannel";
    const FILE_PATH = "movies.json";
    const TOKEN = "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"; // Replace this

    document.getElementById("movieForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = document.getElementById("message");
      message.textContent = "Uploading...";

      const movie = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        poster: document.getElementById("poster").value,
        videoUrl: document.getElementById("videoUrl").value,
        category: document.getElementById("category").value,
        vjName: document.getElementById("vjName").value,
        uploadedAt: new Date().toISOString()
      };

      try {
        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;

        // Get the current file data (to append)
        const res = await fetch(apiUrl, {
          headers: { Authorization: `token ${TOKEN}` }
        });

        let sha = null;
        let movies = [];

        if (res.ok) {
          const data = await res.json();
          sha = data.sha;
          const existingContent = JSON.parse(atob(data.content));
          movies = existingContent;
        }

        // Add new movie
        movies.unshift(movie);

        // Upload updated JSON
        const upload = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: `token ${TOKEN}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: `Added movie: ${movie.title}`,
            content: btoa(JSON.stringify(movies, null, 2)),
            sha: sha
          }),
        });

        if (upload.ok) {
          message.style.color = "#66fcf1";
          message.textContent = "✅ Movie uploaded successfully!";
          document.getElementById("movieForm").reset();
        } else {
          const error = await upload.json();
          message.style.color = "red";
          message.textContent = `❌ Upload failed: ${error.message}`;
        }
      } catch (err) {
        message.style.color = "red";
        message.textContent = `❌ Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
