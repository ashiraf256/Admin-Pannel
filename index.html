<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoXtream Admin Panel</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0b0c10;
    color: #fff;
    padding: 20px;
  }
  h1 { text-align: center; color: #66ccff; }
  form, .movie-box {
    max-width: 700px;
    margin: 20px auto;
    background: #1f2833;
    padding: 20px;
    border-radius: 8px;
  }
  input, textarea, select, button {
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border: none;
    border-radius: 5px;
  }
  input, textarea, select { background: #0b0c10; color: #fff; }
  button {
    background: #45a29e;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #66fcf1; color: #000; }
</style>
</head>
<body>
  <h1>LeoXtream Admin Panel</h1>

  <form id="loginForm">
    <h3>Login</h3>
    <input type="password" id="password" placeholder="Enter admin password" required>
    <button type="submit">Login</button>
  </form>

  <div id="adminArea" style="display:none;">
    <div class="token-box">
      <h3>GitHub Token Setup</h3>
      <input type="text" id="tokenInput" placeholder="Enter your GitHub Token">
      <button onclick="saveToken()">Save Token</button>
    </div>

    <div class="movie-box">
      <h3>Search TMDB Movie</h3>
      <input type="text" id="searchQuery" placeholder="Search for a movie...">
      <button onclick="searchMovie()">Search</button>
    </div>

    <div id="results"></div>

    <form id="movieForm">
      <h3>Manual Movie Entry</h3>
      <input type="text" id="title" placeholder="Movie Title" required>
      <textarea id="description" placeholder="Description"></textarea>
      <input type="text" id="poster" placeholder="Poster URL">
      <input type="text" id="link" placeholder="Movie Link (server)">
      <input type="text" id="vjname" placeholder="VJ Name">
      <button type="submit">Add Movie</button>
    </form>
  </div>

<script>
const REPO = "ashiraf256/Admin-Pannel";
const FILE_PATH = "movies.json";

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const pass = document.getElementById("password").value;
  if (pass === "admin123") {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("adminArea").style.display = "block";
  } else {
    alert("Wrong password!");
  }
});

function saveToken() {
  const token = document.getElementById("tokenInput").value;
  if (token.trim() === "") return alert("Enter a token first");
  localStorage.setItem("github_token", token);
  alert("Token saved!");
}

async function searchMovie() {
  const query = document.getElementById("searchQuery").value.trim();
  if (!query) return;
  const apiKey = "YOUR_TMDB_KEY";
  const url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  const data = await res.json();
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  data.results.slice(0, 5).forEach(movie => {
    const div = document.createElement("div");
    div.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w200${movie.poster_path}" style="width:100px;">
      <b>${movie.title}</b><br>${movie.overview}<br>
      <button onclick='selectMovie("${movie.title.replace(/"/g,"'")}", "${movie.overview.replace(/"/g,"'")}", "https://image.tmdb.org/t/p/w500${movie.poster_path}")'>Select</button>
      <hr>
    `;
    resultsDiv.appendChild(div);
  });
}

function selectMovie(title, description, poster) {
  document.getElementById("title").value = title;
  document.getElementById("description").value = description;
  document.getElementById("poster").value = poster;
}

document.getElementById("movieForm").addEventListener("submit", async e => {
  e.preventDefault();
  const movie = {
    title: title.value,
    description: description.value,
    poster: poster.value,
    link: link.value,
    vjname: vjname.value
  };
  await saveMovie(movie);
});

async function saveMovie(movie) {
  const token = localStorage.getItem("github_token");
  if (!token) return alert("Token not found! Please save it first.");
  
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`);
  const data = await res.json().catch(() => []);
  let movies = [];
  
  if (data.content) {
    const decoded = atob(data.content);
    movies = JSON.parse(decoded);
  }

  movies.unshift(movie);
  const updated = btoa(JSON.stringify(movies, null, 2));

  await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
    method: "PUT",
    headers: {
      Authorization: `token ${token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: "Add new movie",
      content: updated,
      sha: data.sha
    })
  }).then(r => {
    if (r.ok) alert("Movie added successfully!");
    else alert("Failed to save movie!");
  });
}
</script>
</body>
  </html>
