<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeoXtream Admin Panel</title>
<style>
  body {
    background: #0b0c10;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  .login, .admin {
    max-width: 600px;
    margin: 0 auto;
    background: #1f2833;
    padding: 20px;
    border-radius: 10px;
  }
  input, textarea, button {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: none;
    border-radius: 5px;
  }
  input, textarea {
    background: #0b0c10;
    color: #fff;
  }
  button {
    background: #45a29e;
    color: #fff;
    font-weight: bold;
  }
  button:hover {
    background: #66fcf1;
    color: #000;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <h2 style="text-align:center;">🎬 LeoXtream Admin Panel</h2>

  <div id="login" class="login">
    <h3>Login</h3>
    <input type="password" id="password" placeholder="Enter admin password">
    <button onclick="checkPassword()">Login</button>
  </div>

  <div id="admin" class="admin hidden">
    <h3>Upload Movie</h3>
    <input id="token" placeholder="Enter GitHub Token">
    <input id="repo" value="ashiraf256/LeoXtream" readonly>
    <input id="movieTitle" placeholder="Movie Title">
    <textarea id="movieDescription" placeholder="Movie Description"></textarea>
    <input id="posterUrl" placeholder="Poster URL (from TMDB)">
    <input id="videoUrl" placeholder="Video Link (VJ server)">
    <input id="vjName" placeholder="VJ Name">
    <button onclick="searchTMDB()">Search from TMDB</button>
    <input id="tmdbQuery" placeholder="Search TMDB movie">
    <div id="tmdbResults"></div>
    <button onclick="uploadMovie()">Upload to GitHub</button>
  </div>

  <script>
    const PASSWORD = "admin123";

    function checkPassword() {
      const pass = document.getElementById('password').value;
      if (pass === PASSWORD) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('admin').classList.remove('hidden');
      } else {
        alert("Incorrect password!");
      }
    }

    async function searchTMDB() {
      const query = document.getElementById('tmdbQuery').value;
      if (!query) return alert('Enter a movie name!');
      const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=d6b0fe020db56e35227657fd8c0afd5c&query=${encodeURIComponent(query)}`);
      const data = await res.json();
      const container = document.getElementById('tmdbResults');
      container.innerHTML = '';
      data.results.slice(0, 5).forEach(m => {
        const div = document.createElement('div');
        div.innerHTML = `
          <p><b>${m.title}</b> (${m.release_date})</p>
          <img src="https://image.tmdb.org/t/p/w200${m.poster_path}" width="100">
          <button onclick='selectMovie("${m.title.replace(/"/g, '&quot;')}", "${m.overview.replace(/"/g, '&quot;')}", "https://image.tmdb.org/t/p/w500${m.poster_path}")'>Select</button>
        `;
        container.appendChild(div);
      });
    }

    function selectMovie(title, desc, poster) {
      document.getElementById('movieTitle').value = title;
      document.getElementById('movieDescription').value = desc;
      document.getElementById('posterUrl').value = poster;
    }

    async function uploadMovie() {
      const token = document.getElementById('token').value.trim();
      if (!token) return alert('Please enter GitHub token!');

      const repo = document.getElementById('repo').value;
      const movie = {
        title: document.getElementById('movieTitle').value,
        description: document.getElementById('movieDescription').value,
        poster: document.getElementById('posterUrl').value,
        video: document.getElementById('videoUrl').value,
        vj: document.getElementById('vjName').value,
      };

      const res = await fetch(`https://api.github.com/repos/${repo}/contents/movies.json`);
      let existing = [];
      if (res.ok) {
        const json = await res.json();
        existing = JSON.parse(atob(json.content));
        existing.push(movie);

        const response = await fetch(`https://api.github.com/repos/${repo}/contents/movies.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Added ${movie.title}`,
            content: btoa(JSON.stringify(existing, null, 2)),
            sha: json.sha
          })
        });

        if (response.ok) alert('Movie uploaded successfully!');
        else alert('Failed to upload!');
      } else {
        alert('movies.json not found in repo!');
      }
    }
  </script>
</body>
</html>
